<!DOCTYPE html>
<html lang="en">

<head>

    <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg">

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Dividend Finder</title>

    <link
            rel="stylesheet"
            href="css/style.css">

</head>


<body>


<div
        id="pullRefresh"
        class="pull-refresh">

    <span id="pullRefreshIcon">
        ↓
    </span>

    <span id="pullRefreshText">
        Pull to refresh
    </span>

</div>


<!-- =====================================================
     FLYING FAVORITE STAR
     ===================================================== -->

<div
        id="favoriteFlyStar"
        class="favorite-fly-star">

    ★

</div>


<div class="app">


    <!-- =================================================
         STICKY FILTER
         ================================================= -->

    <div class="sticky-header">

        <div class="search-card">


            <div
                    class="search-summary"
                    id="searchSummary">

                <div class="summary-content">

                    <div
                            class="date-summary"
                            id="dateSummary">

                        Select dates

                    </div>


                    <div
                            class="investment-summary hidden"
                            id="investmentSummary">
                    </div>

                </div>


                <button
                        class="edit-button"
                        id="editButton"
                        type="button">

                    ✎

                </button>

            </div>


            <div
                    class="search-form"
                    id="searchForm">


                <div class="form-title">

                    Search Dividends

                </div>


                <div class="field">

                    <label for="fromDate">
                        From Date
                    </label>


                    <div class="date-input-wrapper">

                        <input
                                type="date"
                                id="fromDate">

                        <span
                                class="date-display"
                                id="fromDateDisplay">
                        </span>

                    </div>

                </div>


                <div class="field">

                    <label for="toDate">
                        To Date
                    </label>


                    <div class="date-input-wrapper">

                        <input
                                type="date"
                                id="toDate">

                        <span
                                class="date-display"
                                id="toDateDisplay">
                        </span>

                    </div>

                </div>


                <div class="field">

                    <label for="investmentAmount">

                        Investment Amount

                    </label>


                    <input
                            type="number"
                            id="investmentAmount"
                            min="1"
                            placeholder="Enter investment amount">

                </div>


                <div
                        id="filterError"
                        class="filter-error hidden">
                </div>


                <button
                        class="search-button"
                        id="searchButton"
                        type="button">

                    Search

                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main>


        <div class="page-header">


            <div class="page-header-top">


                <h1>

                    Upcoming Dividends

                </h1>


                <select
                        id="sortFilter"
                        class="sort-filter">


                    <option
                            value="expectedDesc">

                        Select Filter

                    </option>


                    <option
                            value="dateAsc">

                        Date: Latest

                    </option>


                    <option
                            value="dividendDesc">

                        Dividend: High

                    </option>


                    <option
                            value="dividendAsc">

                        Dividend: Low

                    </option>


                    <option
                            value="favorites">

                        ⭐ Favorites

                    </option>


                </select>

            </div>


            <p id="resultMessage">

                Sort by Dividend: High to Low

            </p>

        </div>


        <!-- =================================================
             BEAUTIFUL LOADING ANIMATION
             ================================================= -->

        <div
                id="loading"
                class="loading hidden">


            <div class="loading-animation">


                <div class="money-scene">


                    <span class="money-icon money-bag">

                        💰

                    </span>


                    <span class="money-icon coin-one">

                        🪙

                    </span>


                    <span class="money-icon coin-two">

                        🪙

                    </span>


                    <span class="money-icon chart">

                        📈

                    </span>


                    <span class="money-icon sparkle-one">

                        ✨

                    </span>


                    <span class="money-icon sparkle-two">

                        ✨

                    </span>


                </div>

                <div
                        id="loadingMessage"
                        class="loading-message">

                    Scanning upcoming dividends...

                </div>


                <div class="loading-dots">

                    <span></span>

                    <span></span>

                    <span></span>

                </div>


            </div>

        </div>


        <div
                id="error"
                class="error hidden">
        </div>


        <div
                id="empty"
                class="empty hidden">

            No upcoming dividends found.

        </div>


        <div
                id="stockList"
                class="stock-list">
        </div>


        <div class="ai-message">

            People say AI will take our jobs.
            I say, without AI, my job might take me out first. 😂

        </div>


    </main>

</div>


<script src="js/app.js"></script>


</body>

</html>
