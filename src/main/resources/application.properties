spring.application.name=upcoming-dividend-api

# Port: Render / Railway set PORT; locally 8080
server.port=${PORT:8080}

# Gzip responses (JSON, HTML, CSS, JS). SSE (text/event-stream) is excluded on purpose.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
server.compression.min-response-size=1024

# Live update connections (SSE) are long-lived
spring.mvc.async.request-timeout=-1

# Neon backup (optional). Set the DATABASE_URL environment variable; never commit the password.
# DATABASE_URL=postgresql://user:password@host/neondb?sslmode=require
